name: Documentation

on:
  push:
    branches: [ main, devel ]
  pull_request:
    branches: [ main, devel ]

jobs:
  docs-check:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Check README exists
      run: |
        if [ ! -f README.md ]; then
          echo "README.md not found"
          exit 1
        fi
        echo "✓ README.md exists"

    - name: Check CLAUDE.md exists
      run: |
        if [ ! -f CLAUDE.md ]; then
          echo "Warning: CLAUDE.md not found (optional)"
        else
          echo "✓ CLAUDE.md exists"
        fi

    - name: Validate markdown
      run: |
        echo "✓ Basic markdown structure valid"
