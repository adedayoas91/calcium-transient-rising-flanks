[project]
name = "calcium-transient-rising-flank"
version = "0.1.0"
description = "Event-aware causal structure analysis pipeline for calcium transients"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.10.9",
    "numpy>=2.4.6",
    "pandas>=2.3.0",
]

[project.optional-dependencies]
pag = [
    "joblib>=1.2.0",
    "numba>=0.64.0",
    "tigramite>=5.2.10.1",
]
deconvolution = [
    "oasis-deconv>=0.3.2",
]
